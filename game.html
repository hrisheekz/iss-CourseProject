<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Mynerve&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/games.css">
</head>
<body>
    <header>
        <h1>Tic Tac Toe</h1>
        <p id="game-info">Loading.....</p>
    </header>
    <main>
        <div id="status"><strong>Waiting....</strong></div>

        <div id="forfeit-container">
            <button id="forfeit-btn">Forfeit Match</button>
        </div>

        <div id="game-board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div id="game-result" style="display:none">
            <p id="result-message"></p>
            <button id="back-to-lobby">Back to Lobby</button>
        </div>
    </main>
    <script src="/static/game-bg.js"></script>
    <script src="/static/games.js"></script>
</body>
</html>
