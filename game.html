<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="/static/games.css">
</head>

<body>
    <header>
        <h1>Tic Tac Toe</h1>
        <p id="game-info">Loading.....</p>
    </header>
    <main>
        <div id="status">Waiting....</div>
        
        <div style="text-align: center; margin-bottom: 15px;">
            <button id="forfeit-btn" style="display:none; background-color: #ff4c4c; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Forfeit Match</button>
        </div>

        <div id="game-board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div id="game-result" style="display:none">
            <p id="result-message"></p>
            <button id="back-to-lobby">Back to Lobby</button>
        </div>
    </main>
    <script src="/static/games.js"></script>
</body>
</html>
